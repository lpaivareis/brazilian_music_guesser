services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - .:/rails
      - bundle_cache:/usr/local/bundle
    environment:
      RAILS_ENV: development
      PORT: "3000"
    command: >
      bash -c "bin/rails db:prepare && foreman start -f Procfile.dev.docker"

volumes:
  bundle_cache:
